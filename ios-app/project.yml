name: iPhoneWebcam4K
options:
  bundleIdPrefix: com.example.iphonewebcam4k
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en

targets:
  iPhoneWebcam4K:
    type: application
    platform: iOS
    sources:
      - path: iPhoneWebcam4K
    info:
      path: iPhoneWebcam4K/Info.plist
      properties:
        NSCameraUsageDescription: "PCのWebカメラ映像として配信するためにカメラを使用します。"
        NSLocalNetworkUsageDescription: "USB接続されたPCへ映像をストリーミングするためにローカルネットワークを使用します。"
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.iphonewebcam4k
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ENABLE_BITCODE: NO
