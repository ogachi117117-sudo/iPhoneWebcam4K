name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios-app/**"
      - ".github/workflows/build-ios.yml"

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned .app
        run: |
          xcodebuild \
            -project iPhoneWebcam4K.xcodeproj \
            -scheme iPhoneWebcam4K \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA (unsigned)
        run: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/iPhoneWebcam4K.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r iPhoneWebcam4K.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneWebcam4K-unsigned-ipa
          path: ios-app/iPhoneWebcam4K.ipa
          retention-days: 30
